name: Pubblica Scusa non stasera

on:
  push:
    branches: [main]
  # Ogni lunedì controlla se la lista su Google Maps è cambiata.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scarica la lista da Google Maps
        if: github.event_name != 'push'
        env:
          # Facoltativi: se presenti come segreti del repository, aggiorna anche i posti nel database
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 strumenti/aggiorna_lista.py

      - name: Salva i locali nuovi
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- locali.js supabase/luoghi.sql; then
            echo "La lista non è cambiata."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add locali.js supabase/luoghi.sql
          git commit -m "Aggiorna la lista dei locali da Google Maps"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepara il sito
        run: |
          mkdir _site
          cp -r index.html privacy.html termini.html config.js locali.js css js vendor fonts .well-known _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
